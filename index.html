<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cairo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cairo-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/cairo.css" />
    <title>نظام إدارة المبيعات</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sales_order_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.style.colorScheme = theme;
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-amber-500/20 selection:text-amber-900 dark:selection:bg-amber-400/25 dark:selection:text-amber-100">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
